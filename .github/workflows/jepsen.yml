name: Run Restate Jepsen tests
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref for test suite"
        required: false
        default: "main"
      restateCommit:
        description: "Git commit id  (uses restatedev/restate Docker artifact)"
        required: false
        default: ""
        type: string
      restatePr:
        description: "Test against PR Docker artifact (commit takes precedence)"
        required: false
        default: ""
        type: string
      restateImageId:
        description: "Docker image (PR#/commit take precedence; defaults to ghcr.io/restatedev/restate:main)"
        required: false
        default: "ghcr.io/restatedev/restate:main"
        type: string
      testConfig:
        description: "Test configuration parameters"
        required: false
        default: '{"workloads": "set-vo set-mds set-mds-s3 set-mds-gcs set-mds-ddb", "nemeses": "partition-random-node", "duration": "60", "rate": "100", "concurrency": "5n", "testCount": "20"}'
      clusterName:
        description: "Jepsen workers cluster AWS stack name"
        required: false
        type: string
      retainCluster:
        description: "Retain AWS cluster after Jepsen run"
        default: false
        required: false
        type: boolean

permissions:
  id-token: write
  contents: read

# A new push to a PR supersedes its in-progress run; cancelled runs still tear down their cluster.
concurrency:
  group: jepsen-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  jepsen-tests:
    # id tokens are not available on forks
    if: github.event.repository.fork == false
    runs-on: warp-ubuntu-latest-x64-4x
    env:
      CLUSTER_NAME: ${{ inputs.clusterName || format('restatedev-jepsen-{0}', github.event.pull_request.number != null && format('pr-{0}-{1}', github.event.pull_request.number, github.run_id) || format('run-{0}', github.run_id)) }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: restatedev/jepsen
          sparse-checkout: |
            .github

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1 # co-locate with WarpBuild worker
          role-to-assume: "arn:aws:iam::307946634685:role/github-restatedev-jepsen-actions-role"
      - name: Setup Jepsen cluster ${{ env.CLUSTER_NAME }}
        uses: ./.github/actions/setup
        with:
          ref: ${{ inputs.ref }}
          clusterName: ${{ env.CLUSTER_NAME }}
          bucketName: "restate-jepsen-tests-us-east-1"
          tableName: "restate-jepsen-tests"

      - name: Run Jepsen tests
        uses: ./.github/actions/run-tests
        with:
          restateImageId: ${{ inputs.restateImageId }}
          restatePr: ${{ inputs.restatePr }}
          restateCommit: ${{ inputs.restateCommit }}
          # Bucket and key come from gcp/; see gcp/README.md
          gcsBucket: "restate-jepsen-tests-us-east4"
          gcpCredentials: ${{ secrets.GCP_CREDENTIALS }}
          testConfig: ${{ inputs.testConfig || '{"workloads":"set-vo set-mds set-mds-s3 set-mds-gcs set-mds-ddb","nemeses":"partition-random-node","duration":"60","rate":"100","concurrency":"5n","testCount":"5"}' }}
          retainCluster: ${{ inputs.retainCluster || '"false"' }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: "arn:aws:iam::307946634685:role/github-restatedev-jepsen-actions-role"
        if: always()

      - name: Tear down Jepsen cluster ${{ env.CLUSTER_NAME }}
        uses: ./.github/actions/teardown
        if: ${{ always() && !(inputs.retainCluster || false) }}
        with:
          clusterName: ${{ env.CLUSTER_NAME }}
          bucketName: "restate-jepsen-tests-us-east-1"
          tableName: "restate-jepsen-tests"
