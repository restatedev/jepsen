name: Run Restate Jepsen tests
on:
  # Restore automatic runs only after the broker integration is validated.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jepsen-catalog-smoke
  cancel-in-progress: false

jobs:
  jepsen-tests:
    if: github.repository == 'restatedev/jepsen' && github.ref == 'refs/heads/main'
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: 2.11.2
      - name: Build test services and fetch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot-nox
          npm ci --prefix services
          npm run bundle --prefix services
          lein deps
      - name: Authenticate to the cluster broker
        id: acquire-auth
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::307946634685:role/JepsenCatalogPrototype-GitHubCaller7E649B28-Bnq25VpczSlg
          role-session-name: jepsen-${{ github.run_id }}-${{ github.run_attempt }}
          output-env-credentials: false
          output-credentials: true
      - name: Acquire bounded test cluster
        id: cluster
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.acquire-auth.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.acquire-auth.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.acquire-auth.outputs.aws-session-token }}
        run: node --experimental-strip-types scripts/catalog.mts acquire
      - name: Run short Jepsen workloads
        run: |
          for workload in set-vo set-mds-s3 set-mds-ddb; do
            rm -f store/current
            lein run test \
              --nodes-file aws/nodes.txt --username admin \
              --ssh-private-key aws/private-key.pem \
              --dynamodb-table "$(jq -r '.catalog.DynamoDbMetadataTableName' aws/cdk-outputs.json)" \
              --snapshot-bucket "$(jq -r '.catalog.BucketName' aws/cdk-outputs.json)" \
              --metadata-bucket "$(jq -r '.catalog.BucketName' aws/cdk-outputs.json)" \
              --workload "$workload" --nemesis partition-random-node \
              --image ghcr.io/restatedev/restate:main \
              --time-limit 30 --rate 10 --concurrency 5n \
              --num-partitions 1 --test-count 1 --leave-db-running false
            grep -q 'Everything looks good' store/current/jepsen.log
          done
      - name: Authenticate for cleanup
        if: ${{ always() && steps.cluster.outcome != 'skipped' && steps.acquire-auth.outcome == 'success' }}
        id: release-auth
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::307946634685:role/JepsenCatalogPrototype-GitHubCaller7E649B28-Bnq25VpczSlg
          role-session-name: jepsen-${{ github.run_id }}-${{ github.run_attempt }}
          output-env-credentials: false
          output-credentials: true
      - name: Release cluster and confirm deletion
        if: ${{ always() && steps.release-auth.outcome == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.release-auth.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.release-auth.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.release-auth.outputs.aws-session-token }}
        run: node --experimental-strip-types scripts/catalog.mts release
      - name: Remove local SSH key
        if: always()
        run: rm -f aws/private-key.pem aws/private-key.pem.pub
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: jepsen-smoke
          path: store
